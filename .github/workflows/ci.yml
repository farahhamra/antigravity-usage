name: Validate extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: antigravity-usage-vsix
          path: artifacts/antigravity-usage.vsix
